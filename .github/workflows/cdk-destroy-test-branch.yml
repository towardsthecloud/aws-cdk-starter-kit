name: cdk-destroy-test-branch
on:
  workflow_dispatch: {}
  delete: {}
jobs:
  destroy:
    name: Remove deployment of feature branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: test
    if: github.event_name == 'workflow_dispatch' || (github.event.ref_type == 'branch' && github.event.ref != 'main' && !startsWith(github.event.ref, 'hotfix/') && !startsWith(github.event.ref, 'github-actions/') && !startsWith(github.event.ref, 'dependabot/'))
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@v6
      - name: Setup nodejs environment
        id: setup_nodejs_environment
        uses: actions/setup-node@v7
        with:
          node-version: ">=24.21.0"
          cache: pnpm
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::987654321012:role/GitHubActionsServiceRole
          aws-region: us-east-1
        background: true
      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile
      - name: Wait for AWS authentication
        id: wait_for_aws_authentication
        wait:
          - configure_aws_credentials
      - name: Destroy Branch Stack
        id: destroy_branch_stack
        env:
          GIT_BRANCH_REF: ${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
        run: pnpm run test:branch:destroy:all
