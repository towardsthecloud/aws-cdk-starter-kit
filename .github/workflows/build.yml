# ~~ Generated by projen. To modify, edit .projenrc.ts and run "pnpm exec projen".

name: build
on:
  pull_request: {}
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      self_mutation_happened: ${{ steps.self_mutation.outputs.self_mutation_happened }}
    env:
      CI: "true"
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.7.0
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install dependencies
        id: install_dependencies
        run: pnpm i --no-frozen-lockfile
      - name: Choose Docker cache refresh week
        id: docker_cache_epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Docker asset images
        id: docker_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/docker-assets
          key: docker-assets-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.docker_cache_epoch.outputs.week }}-${{ hashFiles('pnpm-lock.yaml', 'src/**', 'test/**') }}
          restore-keys: docker-assets-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.docker_cache_epoch.outputs.week }}-
      - name: Load Docker asset images
        id: load_docker_asset_images
        run: if [ -f "$RUNNER_TEMP/docker-assets/images.tar" ]; then docker load --input "$RUNNER_TEMP/docker-assets/images.tar"; fi
      - name: Generate and compile
        id: generate_and_compile
        run: |-
          pnpm exec projen default
          pnpm exec projen pre-compile
          pnpm exec projen compile
      - name: Synthesize CDK app
        id: cdk_synth
        run: pnpm exec projen post-compile
        background: true
      - name: Run tests
        id: unit_tests
        run: pnpm exec jest --passWithNoTests --updateSnapshot --runInBand
        background: true
      - name: Wait for synthesis and tests
        id: wait_for_synthesis_and_tests
        wait:
          - cdk_synth
          - unit_tests
      - name: Format and package
        id: format_and_package
        run: |-
          pnpm exec projen biome
          pnpm exec projen package
      - name: Export Docker asset images
        id: export_docker_images
        if: steps.docker_cache.outputs.cache-hit != 'true'
        run: |-
          images=()
          while IFS= read -r image; do images+=("$image"); done < <(docker image ls --filter "reference=cdk-*" --format "{{.Repository}}:{{.Tag}}")
          if [ "${#images[@]}" -gt 0 ]; then
            mkdir -p "$RUNNER_TEMP/docker-assets"
            docker save --output "$RUNNER_TEMP/docker-assets/images.tar" "${images[@]}"
            echo "has-images=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Save Docker asset images
        id: save_docker_asset_images
        if: steps.export_docker_images.outputs.has-images == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/docker-assets
          key: ${{ steps.docker_cache.outputs.cache-primary-key }}
      - name: Find mutations
        id: self_mutation
        run: |-
          git add .
          git diff --staged --patch --exit-code > repo.patch || echo "self_mutation_happened=true" >> $GITHUB_OUTPUT
        shell: bash
        working-directory: ./
      - name: Upload patch
        id: upload_patch
        if: steps.self_mutation.outputs.self_mutation_happened
        uses: actions/upload-artifact@v7
        with:
          name: repo.patch
          path: repo.patch
          overwrite: true
      - name: Fail build on mutation
        id: fail_build_on_mutation
        if: steps.self_mutation.outputs.self_mutation_happened
        run: |-
          echo "::error::Files were changed during build (see build log). If this was triggered from a fork, you will need to update your branch."
          cat repo.patch
          exit 1
  self-mutation:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always() && needs.build.outputs.self_mutation_happened && !(github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PROJEN_GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Download patch
        id: download_patch
        uses: actions/download-artifact@v8
        with:
          name: repo.patch
          path: ${{ runner.temp }}
      - name: Apply patch
        id: apply_patch
        run: '[ -s ${{ runner.temp }}/repo.patch ] && git apply ${{ runner.temp }}/repo.patch || echo "Empty patch. Skipping."'
      - name: Set git identity
        id: set_git_identity
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Push changes
        id: push_changes
        env:
          PULL_REQUEST_REF: ${{ github.event.pull_request.head.ref }}
        run: |-
          git add .
          git commit -s -m "chore: self mutation"
          git push origin "HEAD:$PULL_REQUEST_REF"
